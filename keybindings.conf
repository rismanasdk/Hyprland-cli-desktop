############################
### NATIVE KEYBINDINGS  ###
############################

$mainMod = SUPER

# Command Basic
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod SHIFT, E, exit
bind = $mainMod, E, exec, $fileManager

# Navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# NAVIGATIONS WORKSPACE 
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# MOVE WINDOW TO ANOTHER WORKSPACE 

bind = $mainMod SHIFT, 1, movetoworkspace, 1 # Combination SUPER/Window + SHIFT + 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2 # Combination SUPER/Window + SHIFT + 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3 # Combination Super/Window + SHIFT + 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4 # Combination Super/Window + SHIFT + 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5 # Combination Super/Window + SHIFT + 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6 # Combination Super/Window + SHIFT + 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7 # Combination Super/Window + SHIFT + 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8 # Combination Super/Window + SHIFT + 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9 # Combination Super/Window + SHIFT + 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10 # Combination Super/Window + SHIFT + 0
