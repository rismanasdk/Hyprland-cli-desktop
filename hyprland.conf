###################
### MY PROGRAMS ###
###################

$terminal = kitty
$fileManager = $terminal -e yazi

#################
### AUTOSTART ###
#################

source = ~/.config/hypr/autostart_cli.conf

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0

    col.active_border = rgba(00000000)
    col.inactive_border = rgba(00000000)

    resize_on_border = false
    allow_tearing = false

    layout = dwindle
}

decoration {
    rounding = 0

    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
    }

    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

#############
### INPUT ###
#############

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0

    touchpad {
        natural_scroll = false
    }
}

###################
### KEYBINDINGS ###
###################

source = ~/.config/hypr/keybindings.conf

##############################
### PERSISTENT CLI DESKTOP ###
##############################

workspace = 1, persistent:true, default:true
workspace = r[2-10], persistent:true

##############################
### WINDOW RULES ###
##############################

#Add Application here
windowrule = fullscreen 1, match:class ^(kitty)$
windowrule = workspace 2, match:class ^(brave-browser)$
windowrule = workspace 3, match:class ^(Code)$
windowrule = workspace 4, match:class ^(Postman)$

##############################
### OPTIONAL MULTIMEDIA ###
##############################

bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
